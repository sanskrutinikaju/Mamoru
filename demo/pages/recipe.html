<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Simple Tomato Soup</title>
  </head>
  <body>
    <main>
      <h1>Simple Tomato Soup</h1>
      <p>A warm, simple lunch made with tomatoes and lentils.</p>
      <h2>Ingredients</h2>
      <ul>
        <li>2 cups chopped tomatoes</li>
        <li>1 cup cooked lentils</li>
        <li>1 small onion</li>
        <li>2 cups vegetable broth</li>
      </ul>
      <h2>Method</h2>
      <p>Soften the onion in a pot. Add the tomatoes, lentils, and broth. Simmer for 20 minutes, then serve warm.</p>
    </main>
  </body>
</html>
